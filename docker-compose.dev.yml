# Local development only: Postgres and Redis on the ports .env.local.example expects.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: pipstream_dev}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdev:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:56379:6379"]
volumes:
  pgdev:
