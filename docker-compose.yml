# PipStream on NanoDeploi (Site -> "Use repository docker-compose.yml").
#
#   Ingress service : nginx, port 80   (the only service Traefik reaches; nothing publishes ports)
#   Build commands  : php: composer install --no-dev --optimize-autoloader
#                     node: npm ci && npm run build
#   Release commands: php: php artisan migrate --force
#                     php: php artisan optimize
#                     php: php artisan queue:restart
#
# Two .env files (NanoDeploi's convention):
#   site-root .env  -> infra secrets read by THIS file: DB_PASSWORD, PS_REDIS_PASSWORD_*, the engine
#                      keys, PS_APP_DIR=./src. Generate them once with:
#                      docker compose run --rm --no-deps engine pipstream keys
#   src/.env        -> Laravel's own settings (APP_KEY, mail, Paystack, bot token); see .env.example
#
# Secrets are split per container: Laravel gets only the two PUBLIC sealing keys; inside the
# engine, the supervisor hands each worker (intake, risk, executor) only its own secrets.

x-app: &app
  build: {context: ., dockerfile: docker/php/Dockerfile}
  image: pipstream-php:local
  restart: unless-stopped
  env_file: [.env]
  volumes: ["${PS_APP_DIR:-.}:/var/www/html"]
  environment: &app-env
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: pipstream
    DB_USERNAME: pipstream
    DB_PASSWORD: ${DB_PASSWORD:?set in the site-root .env}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_USERNAME: laravel
    REDIS_PASSWORD: ${PS_REDIS_PASSWORD_LARAVEL:?}
    PS_INTAKE_PUBLIC_KEY: ${PS_INTAKE_PUBLIC_KEY:?}
    PS_EXECUTOR_PUBLIC_KEY: ${PS_EXECUTOR_PUBLIC_KEY:?}
    PS_ENGINE_URL: http://engine:8001
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  # ------------------------------------------------------------------ web (Laravel + React)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - "${PS_APP_DIR:-.}:/var/www/html:ro"
      - "${PS_APP_DIR:-.}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [php]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      retries: 5

  php:
    <<: *app

  events:      # engine events -> alerts, Telegram login answers (pipstream:consume)
    <<: *app
    command: ["php", "artisan", "pipstream:consume"]

  queue:       # sends alerts (database, Telegram bot, email)
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  node:        # build-only: NanoDeploi runs `npm ci && npm run build` here (web/ -> public/spa)
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: ["${PS_APP_DIR:-.}:/app"]
    command: ["sleep", "infinity"]

  # ------------------------------------------------------------------ the Python engine
  engine:      # ONE service: intake (Telegram + parser), risk, executor as child processes
    build: {context: ./engine}
    image: pipstream-engine:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PS_ENV: production
      PS_DATABASE_URL: postgresql://pipstream:${DB_PASSWORD}@postgres:5432/pipstream
      PS_REDIS_HOST: redis
      PS_REDIS_PORT: "6379"
      PS_REDIS_PASSWORD_INTAKE: ${PS_REDIS_PASSWORD_INTAKE:?}
      PS_REDIS_PASSWORD_RISK: ${PS_REDIS_PASSWORD_RISK:?}
      PS_REDIS_PASSWORD_EXECUTOR: ${PS_REDIS_PASSWORD_EXECUTOR:?}
      PS_INTAKE_PRIVATE_KEY: ${PS_INTAKE_PRIVATE_KEY:?}
      PS_TELEGRAM_API_ID: ${PS_TELEGRAM_API_ID:-}
      PS_TELEGRAM_API_HASH: ${PS_TELEGRAM_API_HASH:-}
      PS_INTENT_SIGNING_KEY: ${PS_INTENT_SIGNING_KEY:?}
      PS_INTENT_VERIFY_KEY: ${PS_INTENT_VERIFY_KEY:?}
      PS_EXECUTOR_PRIVATE_KEY: ${PS_EXECUTOR_PRIVATE_KEY:?}
      PS_METAAPI_TOKEN: ${PS_METAAPI_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 30s

  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipstream
      POSTGRES_DB: pipstream
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipstream"]
      interval: 5s
      retries: 20

  redis-acl:   # writes users.acl: one Redis user per worker + laravel, each limited to its own streams
    image: pipstream-engine:local
    build: {context: ./engine}
    restart: "no"
    user: "0"
    command: ["sh", "-c", "pipstream acl > /acl/users.acl && chmod 644 /acl/users.acl"]
    environment:
      PS_REDIS_PASSWORD_ADMIN: ${PS_REDIS_PASSWORD_ADMIN:?}
      PS_REDIS_PASSWORD_INTAKE: ${PS_REDIS_PASSWORD_INTAKE:?}
      PS_REDIS_PASSWORD_RISK: ${PS_REDIS_PASSWORD_RISK:?}
      PS_REDIS_PASSWORD_EXECUTOR: ${PS_REDIS_PASSWORD_EXECUTOR:?}
      PS_REDIS_PASSWORD_LARAVEL: ${PS_REDIS_PASSWORD_LARAVEL:?}
    volumes: [redis-acl:/acl]
    network_mode: none

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--aclfile", "/acl/users.acl", "--appendonly", "yes"]
    depends_on:
      redis-acl: {condition: service_completed_successfully}
    volumes: [redis-acl:/acl:ro, redisdata:/data]
    healthcheck:   # NOAUTH also proves the server is up (the default user is disabled)
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  redis-acl:
