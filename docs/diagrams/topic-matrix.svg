'#0F172A' text-anchor='start'>billing.webhook</text><rect x='1095.5' y='579' width='84' height='22' rx='11' fill='#fff' stroke='#334155' stroke-width='1.5'/><text x='1137.5' y='595' font-size='11.5' font-weight='700' fill='#334155' text-anchor='middle'>consume</text><rect x='1230.5' y='579' width='84' height='22' rx='11' fill='#2457C5'/><text x='1272.5' y='595' font-size='11.5' font-weight='800' fill='#fff' text-anchor='middle'>PUBLISH</text><text x='44' y='635' font-size='14' font-weight='500' fill='#0F172A' text-anchor='start'>billing.changed</text><rect x='555.5' y='619' width='84' height='22' rx='11' fill='#fff' stroke='#2563EB' stroke-width='1.5' stroke-dasharray='4 3'/><text x='597.5' y='635' font-size='11.5' font-weight='700' fill='#2563EB' text-anchor='middle'>broadcast</text><rect x='1095.5' y='619' width='84' height='22' rx='11' fill='#2457C5'/><text x='1137.5' y='635' font-size='11.5' font-weight='800' fill='#fff' text-anchor='middle'>PUBLISH</text><rect x='30' y='650' width='1310' height='40' rx='0' fill='#F8FAFC' stroke='#F8FAFC' stroke-width='1.5'/><text x='44' y='675' font-size='14' font-weight='500' fill='#0F172A' text-anchor='start'>config.changed</text><rect x='285.5' y='659' width='84' height='22' rx='11' fill='#fff' stroke='#2563EB' stroke-width='1.5' stroke-dasharray='4 3'/><text x='327.5' y='675' font-size='11.5' font-weight='700' fill='#2563EB' text-anchor='middle'>broadcast</text><rect x='420.5' y='659' width='84' height='22' rx='11' fill='#fff' stroke='#2563EB' stroke-width='1.5' stroke-dasharray='4 3'/><text x='462.5' y='675' font-size='11.5' font-weight='700' fill='#2563EB' text-anchor='middle'>broadcast</text><rect x='555.5' y='659' width='84' height='22' rx='11' fill='#fff' stroke='#2563EB' stroke-width='1.5' stroke-dasharray='4 3'/><text x='597.5' y='675' font-size='11.5' font-weight='700' fill='#2563EB' text-anchor='middle'>broadcast</text><rect x='690.5' y='659' width='84' height='22' rx='11' fill='#fff' stroke='#2563EB' stroke-width='1.5' stroke-dasharray='4 3'/><text x='732.5' y='675' font-size='11.5' font-weight='700' fill='#2563EB' text-anchor='middle'>broadcast</text><rect x='1230.5' y='659' width='84' height='22' rx='11' fill='#2457C5'/><text x='1272.5' y='675' font-size='11.5' font-weight='800' fill='#fff' text-anchor='middle'>PUBLISH</text><text x='44' y='730' font-size='13' font-weight='400' fill='#475569' text-anchor='start'>PUBLISH = only this service&#x27;s Redis user can XADD the stream.   consume = consumer group, each event handled by one replica.</text><text x='44' y='752' font-size='13' font-weight='400' fill='#475569' text-anchor='start'>broadcast = read-only, every replica sees every event (config reloads, entitlements).   Failed events go to the dlq stream after 5 attempts.</text><text x='44' y='774' font-size='13' font-weight='600' fill='#15803D' text-anchor='start'>Second layer for trade.intent: the router also verifies the Ed25519 signature, the 5 s expiry and a one-time idempotency key.</text></svg>