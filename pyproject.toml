[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipstream"
version = "0.1.0"
description = "PipStream: Telegram signal copier, event-driven services (low-cost experiment)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "redis>=5.0",
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "websockets>=12",
  "cryptography>=42",
  "pyyaml>=6",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]
mt5 = ["rpyc>=6,<7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pipstream = "pipstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pipstream" = ["db/migrations/*.sql", "services/parser/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
